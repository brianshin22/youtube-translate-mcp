[project]
name = "youtube-translate-mcp"
version = "0.2.1"
description = "YouTube Translate MCP server for accessing YouTube video transcripts and translations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
]

[project.scripts]
youtube-translate-mcp = "youtube_translate_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
